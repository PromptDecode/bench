name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt, clippy, test, regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust (rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all

      # The regression gate: recompute the benchmark from the committed corpus
      # and compare against the committed results.json and baseline.json. This
      # is the step that makes the published numbers a fact rather than a claim.
      - name: Regression gate
        run: cargo run -p promptdecode-bench -- --check

      - name: Committed artifacts unchanged
        run: git diff --exit-code results.json baseline.json
